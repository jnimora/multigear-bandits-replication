# Uses only saved model arrays from the selected archive. No instance generator.
protocol = "initialization-replay-v1"
states = [16]
gears = [1, 3]
draws = [1]
eta = [0.0, 0.1]
criteria = ["discounted", "average"]
repetitions = 3
warmups = 2
target_window_seconds = 0.005
max_batch_size = 32
batch_memory_mib = 128.0
memory_budget_gib = 2.0
max_case_seconds = 1800.0
audit_tolerance = 1e-7
reference_block_columns = 64
require_clean_git = true
# beta, screening and terminal-update convention are inherited from the archive.
